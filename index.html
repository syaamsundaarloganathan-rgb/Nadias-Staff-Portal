<style>
/* VOICE: calm, clinical, trustworthy — a tool a pharmacy counter uses between customers.
   IDEA: a dispensing card — each staff member's balance shown like a measured dose.
   PICTURE: the leave meters, large, at the top of Home; a keypad at sign-in; a month calendar of who's off.
   COLOUR and TYPE: deep clinical teal band, white cards, mint for measured fill, coral only for pending/attention. Figtree.
   LAYOUT: band header with tabs, one working column on phones, two columns from 900px. */
:root{color-scheme:light dark;
--bg:light-dark(#f3f6f5,#0b1a1d);--card:light-dark(#ffffff,#122629);--ink:light-dark(#10292e,#e4efed);
--mute:light-dark(#5a6e71,#91a7a9);--line:light-dark(#dfe7e5,#23393d);--band:light-dark(#0d4850,#0c3338);
--mint:light-dark(#21a58c,#3cc7aa);--mintsoft:light-dark(#dcf1ea,#163a36);--coral:light-dark(#df5a45,#ff7b66);
--coralsoft:light-dark(#fbe6e2,#3a221f);--field:light-dark(#f8faf9,#0f2124);--hol:light-dark(#fff4d6,#3a321a);
--c1:light-dark(#0d4850,#5fb3bd);--c2:light-dark(#21a58c,#3cc7aa);--c3:light-dark(#6f86d9,#93a6ec)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
.olt{table-layout:fixed;font-size:14px}.olt td,.olt th{padding:9px 5px;overflow-wrap:anywhere}.olt th{font-size:12px}.olt th:first-child,.olt td:first-child{width:40%}
a{color:var(--mint)}
.band{background:var(--band);color:#fff;padding:calc(18px + env(safe-area-inset-top)) max(4vw,16px,env(safe-area-inset-right)) 0}
.top{max-width:1180px;margin:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand small{display:block;font-weight:500;font-size:13px;opacity:.75;letter-spacing:0}
.cross{width:34px;height:34px;border-radius:9px;background:#fff;display:grid;place-items:center;flex:none}
.logo{background:#fff;border-radius:12px;height:46px;padding:6px 12px;display:flex;align-items:center;flex:none}.logo img{height:100%;width:auto;display:block}
.logo.sq{width:46px;padding:5px}
.lrow{display:flex;justify-content:center;align-items:center;gap:12px 16px;flex-wrap:wrap}.lrow img{height:34px;width:auto;max-width:30%}
.entpick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:6px 0 0}
.entpick button{border:2px solid var(--line);background:var(--field);border-radius:14px;min-height:64px;padding:10px;cursor:pointer;display:grid;place-items:center}
.entpick button.on{border-color:var(--mint);background:var(--mintsoft)}
.entpick img{max-width:100%;max-height:38px;width:auto}
.elogo{height:28px;width:auto;display:block;margin-bottom:6px}
.ent img{max-height:28px;max-width:100%;width:auto;display:block}
.today{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px;margin-bottom:22px}
.tc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}.tc img{height:30px;width:auto;display:block;margin-bottom:10px}
.tc b{font-size:24px;font-weight:800;display:block;line-height:1.2}
.who{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:14px;text-align:right}
.who b{display:block;font-size:15px}
.out{background:rgba(255,255,255,.14);border:0;border-radius:10px;padding:0 14px;min-height:40px;color:#fff;cursor:pointer}
nav{max-width:1180px;margin:14px auto 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav button{flex:none;background:none;border:0;color:rgba(255,255,255,.78);padding:12px 14px;min-height:46px;border-radius:12px 12px 0 0;cursor:pointer;white-space:nowrap;font-weight:600}
nav button.on{background:var(--bg);color:var(--ink)}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--coral);color:#fff;font-size:12px;margin-left:6px;padding:0 6px}
main{max-width:1180px;margin:auto;padding:24px max(4vw,16px) 60px}
h1{font-size:clamp(26px,4vw,36px);line-height:1.1;margin:0 0 4px;text-wrap:balance;letter-spacing:-.02em}
h2{font-size:20px;margin:0 0 12px}h3{font-size:17px;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 22px}
.grid{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media(min-width:900px){.grid.two{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}.grid.half{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.mb{margin-bottom:20px}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px;margin-bottom:22px}
.meter{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.mh b{font-size:15px}.big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:8px 0 12px}
.big span{font-size:15px;font-weight:500;color:var(--mute);margin-left:4px}
.bar{height:14px;border-radius:8px;background:var(--mintsoft);display:flex;overflow:hidden}
.bar i{background:var(--mint);transition:width .6s ease}
.bar s{background:repeating-linear-gradient(135deg,var(--coral) 0 5px,transparent 5px 9px);opacity:.75}
.ml{font-size:13px;color:var(--mute);margin-top:8px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:14px}
input,select,textarea{display:block;width:100%;margin-top:6px;background:var(--field);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:16px;min-height:46px}
input[type=file]{padding:9px}
textarea{resize:vertical}

.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:0 14px}
.row4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:0 12px}
.segs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.seg{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:0 16px;min-height:44px;cursor:pointer;font-weight:600}
.seg.on{background:var(--band);border-color:var(--band);color:#fff}
.btn{background:var(--mint);color:#fff;border:0;border-radius:12px;min-height:48px;padding:0 22px;font-weight:700;cursor:pointer}
.btn.dark{background:var(--band)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.ghost{background:none;border:1px dashed var(--line);border-radius:11px;min-height:44px;padding:0 14px;cursor:pointer;color:var(--mute);font-weight:600}
.sm{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.ok{background:var(--mint);border-color:var(--mint);color:#fff}.no{color:var(--coral);border-color:currentColor}
.calc{background:var(--mintsoft);border-radius:12px;padding:12px 14px;margin:4px 0 16px;font-size:15px}
.calc.warn{background:var(--coralsoft)}
.hint{font-size:13px;color:var(--mute);margin:14px 0 0}
fieldset{border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 14px}
legend{font-weight:700;font-size:14px;padding:0 6px}
.qrow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.3fr) 44px;gap:8px;margin-bottom:8px}
.qrow input,.qrow select{margin:0}
.x{border:0;background:none;font-size:22px;color:var(--mute);cursor:pointer;min-height:44px}
.chk{display:flex;align-items:center;gap:10px}.chk input{width:22px;min-height:22px;margin:0}
.list{display:grid;gap:12px}
.item{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.ih{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.ih b{font-size:16px}.meta{color:var(--mute);font-size:14px}
.chip{display:inline-block;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.pending{background:var(--coralsoft);color:var(--coral)}.approved,.reviewed,.sent{background:var(--mintsoft);color:var(--mint)}
.rejected{background:var(--line);color:var(--mute)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.acts input{flex:1 1 200px;margin:0;min-height:40px}
.qs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.qs span{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:3px 9px}
.att{display:inline-flex;align-items:center;gap:10px;margin-top:10px;font-weight:600;font-size:14px}
.att img{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.clash{margin-top:8px;font-size:14px;color:var(--coral);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:14px;margin-bottom:22px}
.tile{background:var(--band);color:#fff;border-radius:16px;padding:16px 18px;border:0;text-align:left;cursor:pointer}
.tile b{display:block;font-size:30px;font-weight:800;line-height:1.1}.tile span{font-size:14px;opacity:.85}
.ent{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:center;margin-bottom:12px;font-size:15px}
.ent .bar{height:12px}.ent em{font-style:normal;font-weight:700;white-space:nowrap;text-align:right}
.ai{white-space:pre-line;font-size:16px;line-height:1.6;min-height:24px}
.empty{color:var(--mute);text-align:center;padding:26px;border:1px dashed var(--line);border-radius:16px}
.note{background:var(--coralsoft);color:var(--ink);border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:15px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}th{font-size:13px;color:var(--mute);font-weight:600}
td.num,th.num{text-align:right;white-space:nowrap}
.calnav{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.calnav h2{margin:0;min-width:170px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dh{font-size:12px;color:var(--mute);text-align:center;font-weight:600;padding:4px 0}
.day{background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:96px;padding:6px;font-size:12px;overflow:hidden}
.day.sun{background:var(--field);color:var(--mute)}.day.ph{background:var(--hol)}.day.td{border:2px solid var(--mint)}.day.pad{visibility:hidden}
.day .n{font-weight:700;font-size:13px}.day .hn{display:block;font-size:11px;color:var(--mute);line-height:1.2}
.day .p{display:block;margin-top:3px;border-radius:5px;padding:1px 5px;background:var(--mintsoft);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day .p.pd{background:none;border:1px dashed var(--coral)}
.dots{display:none}
.chart{display:flex;align-items:stretch;gap:3px;height:240px;padding-top:8px}
.col{flex:1;display:flex;flex-direction:column;min-width:0}
.col .bx{flex:1;display:flex;flex-direction:column;justify-content:flex-end}
.stk{display:flex;flex-direction:column-reverse;border-radius:4px 4px 0 0;overflow:hidden}
.stk i{display:block}
.col span{font-size:11px;color:var(--mute);text-align:center;height:16px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.pol p{margin:0 0 10px}.pol h3{margin:20px 0 8px}.pol ul{margin:0 0 10px;padding-left:20px}
ol.steps{padding-left:20px;margin:0}ol.steps li{margin-bottom:8px}
.login{min-height:100vh;min-height:100dvh;background:var(--band);display:grid;place-items:center;padding:24px 16px}
.lcard{background:var(--card);color:var(--ink);border-radius:24px;padding:28px 24px;width:min(100%,380px);text-align:center;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.pins{display:flex;justify-content:center;gap:14px;margin:22px 0 8px}
.pins i{width:52px;height:60px;border-radius:14px;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:26px;font-weight:800}
.pins i.f{border-color:var(--mint);background:var(--mintsoft)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.pad button{min-height:62px;border-radius:16px;border:1px solid var(--line);background:var(--field);font-size:24px;font-weight:700;cursor:pointer}
.pad button.fn{font-size:15px;color:var(--mute)}
.linkb{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;min-height:44px;margin-top:6px}
.err{color:var(--coral);min-height:22px;font-size:14px;font-weight:600}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lang{display:inline-flex;border:1px solid color-mix(in srgb,currentColor 35%,transparent);border-radius:10px;overflow:hidden;flex:none}
.lang button{background:none;border:0;color:inherit;min-height:40px;min-width:44px;padding:0 10px;font-weight:700;cursor:pointer;opacity:.7}
.lang button.on{background:color-mix(in srgb,currentColor 18%,transparent);opacity:1}
.ov{position:fixed;inset:0;background:rgba(6,24,27,.55);display:grid;place-items:center;padding:16px;z-index:8}
.ovc{background:var(--card);color:var(--ink);border-radius:22px;padding:24px;width:min(100%,480px);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.5)}
.tp{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px}.tp .seg{display:inline-flex;align-items:center;min-height:34px;font-size:13px;padding:0 12px}
.tpin{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:14px}.tpin span{color:var(--mute)}
.dotsx{display:flex;gap:6px}.dotsx i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dotsx i.on{background:var(--mint)}
.pins.p8{gap:6px}.pins.p8 i{width:34px;height:46px;border-radius:10px;font-size:22px}
.demo{margin-top:14px;font-size:13px;line-height:1.5;color:var(--mute);background:var(--field);border-radius:12px;padding:10px}
.entpick button span{color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:600;transition:transform .3s;z-index:9;max-width:calc(100% - 32px)}
#toast.on{transform:translateX(-50%) translateY(0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:600px){.who span.r{display:none}.qrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.qrow .q-c{grid-column:1/-1}
.ent{grid-template-columns:80px minmax(0,1fr) auto}
.day{min-height:54px;padding:4px}.day .p,.day .hn{display:none}.dots{display:flex;gap:2px;flex-wrap:wrap;margin-top:4px}.dots b{width:7px;height:7px;border-radius:50%;background:var(--mint)}.dots b.pd{background:var(--coral)}.dots b.h{background:#d4a017}
table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:5px 0}.stack td::before{content:attr(data-l);color:var(--mute);font-size:13px}}
</style>

<script src="config.js"></script>

<div id="app"><div class="login"><div class="lcard"><p>Loading the Nadia Group staff portal…</p></div></div></div>
<div id="toast" role="status"></div>
<script>
{
const S={lang:(()=>{try{return localStorage.getItem('nadiaLang')||'en'}catch(e){return'en'}})(),tour:null,staff:{},leaves:[],tasks:[],sales:[],set:{},me:null,tab:'home',lt:'annual',ready:false,canWrite:true,note:'',pin:'',stage:'code',busy:false,cand:null,first:'',err:'',tdate:'',sent:'all',edit:null,del:null,cal:'',rm:'',ai:'',aiBusy:false,polEdit:false};
let db=null,ASSETS=null,DL=null,SAMPLE=null;const C=window.claude;
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const today=()=>iso(new Date());
const MON_EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],MON_BM=['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];let MON=MON_EN;
const MONF_EN=['January','February','March','April','May','June','July','August','September','October','November','December'],MONF_BM=['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];let MONF=MONF_EN;
const BMx=()=>S.lang==='bm';const tx=(en,bm)=>S.lang==='bm'?bm:en;
function setLang(l){S.lang=l;MON=l==='bm'?MON_BM:MON_EN;MONF=l==='bm'?MONF_BM:MONF_EN;try{localStorage.setItem('nadiaLang',l)}catch(e){}document.documentElement.lang=l==='bm'?'ms':'en';render()}
if(S.lang==='bm'){MON=MON_BM;MONF=MONF_BM;document.documentElement.lang='ms'}
const fd=s=>{if(!s)return'';const[y,m,d]=s.split('-');return +d+' '+MON[+m-1]+' '+y};
const fm=m=>MONF[+m.slice(5,7)-1]+' '+m.slice(0,4);
const shiftM=(m,k)=>{const d=new Date(+m.slice(0,4),+m.slice(5,7)-1+k,1);return d.getFullYear()+'-'+pad2(d.getMonth()+1)};
const rm=n=>'RM '+Number(n||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:0};
const dayDiff=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
const ENT=['Pharmacy','Dental','Clinic'];
const UNITS=['Pharmacy','Dental','Clinic','Pharmacy Wholesale','Head Office'];
const LOGO={Pharmacy:'img/pharmacy.png',Dental:'img/dental.png',Clinic:'img/clinic.png','Pharmacy Wholesale':'img/pharmacy.png'};
const ROLES={staff:'Staff',hr:'HR Manager',director:'Director'};
const LT={annual:'Annual leave',mc:'Medical leave (MC)',emergency:'Emergency leave',half:'Half day',timeoff:'Time off',hospital:'Hospitalisation',maternity:'Maternity leave',paternity:'Paternity leave',compassionate:'Compassionate leave',marriage:'Marriage leave',replacement:'Replacement leave',exam:'Exam / study leave',pilgrimage:'Pilgrimage (Hajj / Umrah)',unpaid:'Unpaid leave'};
const MAIN=['annual','mc','emergency','half','timeoff'];
const OTHER=['hospital','maternity','paternity','compassionate','marriage','replacement','exam','pilgrimage','unpaid'];
const DEF={annual:14,mc:14,hospital:60,emergency:3,timeoff:4,maternity:98,paternity:7,compassionate:3,marriage:3,replacement:0,exam:3,pilgrimage:0};

const DEFAULT_POLICY=`About this policy
- This policy follows the Employment Act 1955 as amended by the Employment (Amendment) Act 2022, in force since 1 January 2023, and the Holidays Act 1951. It was checked in November 2026, when no later changes to private-sector leave had been made.
- Items marked "minimum" are set by law. Nadia Group may give more, never less. Where your employment contract gives you more, your contract applies.
- Items marked "Nadia Group policy" are company rules, not law, and HR may change them.
- This is a summary for staff, not legal advice. If anything here differs from the Act, the Act applies.

Leave year and applying
- The leave year runs from 1 January to 31 December.
- Apply for all leave in the staff portal. Leave is only confirmed once it shows "Approved".
- The HR Manager or the Director approves leave. The HR Manager's own leave is approved by the Director.
- Sundays and public holidays are not counted as leave days, except for maternity and paternity leave, which run for consecutive calendar days.

Annual leave (minimum, Section 60E)
- Less than 2 years of service: at least 8 days a year.
- 2 to 5 years of service: at least 12 days a year.
- More than 5 years of service: at least 16 days a year.
- If you have worked less than 12 months, your leave is worked out in proportion to the months you have completed. Half a day or more is rounded up to a full day.
- Apply at least 3 working days before your leave starts (Nadia Group policy).
- A half day uses 0.5 day of annual leave.
- Take your annual leave within 12 months after the end of the year it was earned. At year end, HR carries your unused days into the new year; they show on your Home page with the date they must be used by. Leave not taken by then is forfeited, unless the company asked you not to take it, in which case those days are paid.
- If you are absent without permission or reasonable excuse for more than 10% of working days in a year, you may lose that year's annual leave.

Sick leave / MC (minimum, Section 60F)
- Less than 2 years of service: at least 14 days a year.
- 2 to 5 years of service: at least 18 days a year.
- More than 5 years of service: at least 22 days a year.
- Sick leave must be certified by a registered medical practitioner, a medical officer or a dental surgeon. Attach a clear photo of your MC in the portal.
- Inform your supervisor or HR within 48 hours of the start of your sick leave. Sick leave without an MC, or without informing the company within 48 hours, is treated as absence without permission.

Hospitalisation leave (minimum, Section 60F)
- Up to 60 days a year when a registered medical practitioner or medical officer certifies that hospitalisation is needed.
- This is in addition to your sick leave days.
- Attach the hospital admission or discharge note.

Maternity leave (minimum, Section 37)
- 98 consecutive days for each birth.
- It may start no earlier than 30 days before the expected date of delivery and no later than the day after delivery.
- It is paid at your ordinary rate if you have worked for the company for at least 90 days in the 9 months before delivery and have fewer than five surviving children.
- The company cannot end the employment of a pregnant employee, or one with a pregnancy-related illness, except for misconduct, wilful breach of contract or closure of the business (Section 41A).

Paternity leave (minimum, Section 60FA)
- 7 consecutive paid days for each birth, for married male employees with at least 12 months of service.
- Up to five births in total, whatever the number of spouses.
- Notify HR at least 30 days before the expected birth, or as soon as possible after the birth.

Public holidays (minimum, Section 60D)
- 11 paid public holidays a year, including the 5 compulsory ones: National Day, the Yang di-Pertuan Agong's Birthday, Federal Territory Day, Labour Day and Malaysia Day.
- The year's list is shown in the portal's leave calendar.
- If a public holiday falls on a rest day, the next working day is a holiday. If it falls during your sick leave or annual leave, you get another day off in its place.

Other leave (Nadia Group policy)
- Emergency leave: up to 3 days a year for sudden family emergencies. Call your supervisor first, then apply within 1 working day.
- Compassionate leave: up to 3 days on the death of an immediate family member.
- Marriage leave: 3 days, once during your employment.
- Replacement leave: days off given in return for working on a rest day or public holiday, where HR agrees to time off instead of extra pay.
- Exam / study leave: up to 3 days a year for exams of a course the company has approved.
- Pilgrimage leave (Hajj or Umrah): considered once during your employment. HR confirms the number of days.
- Time off: short absences of a few hours, up to 4 hours a month.
- Unpaid leave: must be approved before it is taken, except in an emergency.
- Your own allowances are shown on your Home page.

Voting day
- Staff get reasonable time off to vote on polling day without a cut in pay (Election Offences Act 1954).`;
const DEFAULT_POLICY_BM=`Tentang polisi ini
- Polisi ini mengikut Akta Kerja 1955 seperti yang dipinda oleh Akta Kerja (Pindaan) 2022, yang berkuat kuasa sejak 1 Januari 2023, dan Akta Hari Kelepasan 1951. Ia disemak pada November 2026, ketika tiada perubahan baharu kepada cuti sektor swasta.
- Perkara bertanda "minimum" ditetapkan oleh undang-undang. Nadia Group boleh memberi lebih, tetapi tidak kurang. Jika kontrak pekerjaan anda memberi lebih, kontrak anda terpakai.
- Perkara bertanda "polisi Nadia Group" ialah peraturan syarikat, bukan undang-undang, dan HR boleh mengubahnya.
- Ini ringkasan untuk kakitangan, bukan nasihat undang-undang. Jika ada perbezaan dengan Akta, Akta yang terpakai.

Tahun cuti dan permohonan
- Tahun cuti bermula 1 Januari hingga 31 Disember.
- Mohon semua cuti melalui portal kakitangan. Cuti hanya sah apabila menunjukkan "Diluluskan".
- Pengurus HR atau Pengarah meluluskan cuti. Cuti Pengurus HR sendiri diluluskan oleh Pengarah.
- Hari Ahad dan cuti umum tidak dikira sebagai hari cuti, kecuali cuti bersalin dan cuti paterniti yang dikira mengikut hari kalendar berturut-turut.

Cuti tahunan (minimum, Seksyen 60E)
- Kurang daripada 2 tahun perkhidmatan: sekurang-kurangnya 8 hari setahun.
- 2 hingga 5 tahun perkhidmatan: sekurang-kurangnya 12 hari setahun.
- Lebih daripada 5 tahun perkhidmatan: sekurang-kurangnya 16 hari setahun.
- Jika anda bekerja kurang daripada 12 bulan, cuti anda dikira mengikut bilangan bulan yang telah anda lengkapkan. Setengah hari atau lebih dibundarkan kepada satu hari penuh.
- Mohon sekurang-kurangnya 3 hari bekerja sebelum cuti bermula (polisi Nadia Group).
- Separuh hari menggunakan 0.5 hari cuti tahunan.
- Ambil cuti tahunan dalam tempoh 12 bulan selepas tamat tahun cuti itu diperoleh. Pada akhir tahun, HR membawa ke hadapan baki hari anda ke tahun baharu; ia dipaparkan di halaman Utama bersama tarikh akhir penggunaannya. Cuti yang tidak diambil sebelum tarikh itu akan luput, kecuali syarikat meminta anda tidak mengambilnya, maka hari tersebut akan dibayar.
- Jika anda tidak hadir tanpa kebenaran atau alasan munasabah lebih daripada 10% hari bekerja dalam setahun, anda mungkin hilang cuti tahunan bagi tahun itu.

Cuti sakit / MC (minimum, Seksyen 60F)
- Kurang daripada 2 tahun perkhidmatan: sekurang-kurangnya 14 hari setahun.
- 2 hingga 5 tahun perkhidmatan: sekurang-kurangnya 18 hari setahun.
- Lebih daripada 5 tahun perkhidmatan: sekurang-kurangnya 22 hari setahun.
- Cuti sakit mesti disahkan oleh pengamal perubatan berdaftar, pegawai perubatan atau pakar bedah pergigian. Lampirkan gambar MC yang jelas dalam portal.
- Maklumkan penyelia atau HR dalam tempoh 48 jam dari permulaan cuti sakit. Cuti sakit tanpa MC, atau tanpa makluman kepada syarikat dalam 48 jam, dianggap tidak hadir tanpa kebenaran.

Cuti hospital (minimum, Seksyen 60F)
- Sehingga 60 hari setahun apabila pengamal perubatan berdaftar atau pegawai perubatan mengesahkan kemasukan ke hospital diperlukan.
- Ini adalah tambahan kepada hari cuti sakit anda.
- Lampirkan nota kemasukan atau discaj hospital.

Cuti bersalin (minimum, Seksyen 37)
- 98 hari berturut-turut bagi setiap kelahiran.
- Ia boleh bermula tidak lebih awal daripada 30 hari sebelum jangkaan tarikh bersalin dan tidak lewat daripada sehari selepas bersalin.
- Ia dibayar pada kadar biasa anda jika anda telah bekerja dengan syarikat sekurang-kurangnya 90 hari dalam tempoh 9 bulan sebelum bersalin dan mempunyai kurang daripada lima anak yang masih hidup.
- Syarikat tidak boleh menamatkan pekerjaan pekerja yang hamil, atau yang mengalami penyakit berkaitan kehamilan, kecuali atas salah laku, pelanggaran kontrak dengan sengaja atau penutupan perniagaan (Seksyen 41A).

Cuti paterniti (minimum, Seksyen 60FA)
- 7 hari berbayar berturut-turut bagi setiap kelahiran, untuk pekerja lelaki yang berkahwin dengan sekurang-kurangnya 12 bulan perkhidmatan.
- Sehingga lima kelahiran keseluruhannya, tanpa mengira bilangan isteri.
- Maklumkan HR sekurang-kurangnya 30 hari sebelum jangkaan kelahiran, atau secepat mungkin selepas kelahiran.

Cuti umum (minimum, Seksyen 60D)
- 11 hari cuti umum bergaji setahun, termasuk 5 yang wajib: Hari Kebangsaan, Hari Keputeraan Yang di-Pertuan Agong, Hari Wilayah Persekutuan, Hari Pekerja dan Hari Malaysia.
- Senarai tahun ini dipaparkan dalam kalendar cuti portal.
- Jika cuti umum jatuh pada hari rehat, hari bekerja berikutnya menjadi cuti. Jika ia jatuh semasa cuti sakit atau cuti tahunan anda, anda diberi hari cuti lain sebagai gantinya.

Cuti lain (polisi Nadia Group)
- Cuti kecemasan: sehingga 3 hari setahun untuk kecemasan keluarga yang mengejut. Hubungi penyelia dahulu, kemudian mohon dalam tempoh 1 hari bekerja.
- Cuti ihsan: sehingga 3 hari atas kematian ahli keluarga terdekat.
- Cuti perkahwinan: 3 hari, sekali sepanjang tempoh pekerjaan.
- Cuti gantian: hari cuti yang diberi sebagai ganti bekerja pada hari rehat atau cuti umum, jika HR bersetuju memberi cuti dan bukan bayaran tambahan.
- Cuti peperiksaan / belajar: sehingga 3 hari setahun untuk peperiksaan kursus yang diluluskan syarikat.
- Cuti haji atau umrah: dipertimbangkan sekali sepanjang tempoh pekerjaan. HR mengesahkan bilangan hari.
- Keluar sebentar: ketidakhadiran singkat beberapa jam, sehingga 4 jam sebulan.
- Cuti tanpa gaji: mesti diluluskan sebelum diambil, kecuali dalam kecemasan.
- Kelayakan anda sendiri dipaparkan di halaman Utama.

Hari mengundi
- Kakitangan diberi masa yang munasabah untuk mengundi pada hari mengundi tanpa potongan gaji (Akta Kesalahan Pilihan Raya 1954).`;

function cfRows(){const v=cfVals();return Object.values(S.staff).sort((a,b)=>a.name>b.name?1:-1).map(s=>{const b=bal(s.id,v.y);const unused=Math.max(0,b.annual.cap-b.annual.used);const carry=v.cap==null?unused:Math.min(unused,v.cap);return{s,b,unused,carry,done:s.carry&&+s.carry.from===v.y?s.carry:null}})}
function cfTable(){const v=cfVals(),rows=cfRows();return `<table class="stack"><thead><tr><th>Staff</th><th class="num">${v.y} allowance</th><th class="num">Taken</th><th class="num">Unused</th><th class="num">Will carry to ${v.y+1}</th><th>Already carried</th></tr></thead><tbody>${rows.map(r=>`<tr><td data-l="Staff"><b>${esc(r.s.name)}</b></td><td class="num" data-l="Allowance">${r.b.annual.cap}</td><td class="num" data-l="Taken">${r.b.annual.used}</td><td class="num" data-l="Unused">${r.unused}</td><td class="num" data-l="Will carry"><b>${r.carry}</b></td><td data-l="Already carried">${r.done?`${r.done.days} days, use by ${fd(r.done.expires)}`:'<span class="meta">Not yet</span>'}</td></tr>`).join('')}</tbody></table>${S.leaves.some(l=>l.status==='pending'&&l.from.slice(0,4)===String(v.y))?`<p class="hint">Some ${v.y} leave is still waiting for approval. Decide it first so the unused days are right.</p>`:''}`}

function leaveForm(){const t=S.lt,d=today();let f;

const LT_BM={annual:'Cuti tahunan',mc:'Cuti sakit (MC)',emergency:'Cuti kecemasan',half:'Separuh hari',timeoff:'Keluar sebentar',hospital:'Cuti hospital',maternity:'Cuti bersalin',paternity:'Cuti paterniti',compassionate:'Cuti ihsan',marriage:'Cuti perkahwinan',replacement:'Cuti gantian',exam:'Cuti peperiksaan / belajar',pilgrimage:'Cuti haji / umrah',unpaid:'Cuti tanpa gaji'};
function calcLeave(){const t=S.lt,from=$('#lf-from')?.value,b=bal(S.me.id);let o={ok:true,days:0,hours:0,txt:'',warn:false};const f1=n=>+(+n).toFixed(1);
 if(!from)return{...o,ok:false,txt:tx('Pick a date.','Pilih tarikh.')};
 if(t==='half'){if(holMap()[from]||new Date(from+'T00:00').getDay()===0)return{...o,ok:false,txt:tx('That day is a Sunday or public holiday.','Hari itu hari Ahad atau cuti umum.')};o.days=.5;const l=left(b.annual);o.txt=tx(`0.5 day from annual leave. You’ll have ${f1(l-.5)} days left once approved.`,`0.5 hari daripada cuti tahunan. Baki anda ${f1(l-.5)} hari selepas diluluskan.`);o.warn=l<.5}
 else if(t==='timeoff'){o.hours=hrs($('#lf-t1').value,$('#lf-t2').value);if(!o.hours)return{...o,ok:false,txt:tx('The end time must be after the start time.','Masa tamat mesti selepas masa mula.')};const l=left(b.timeoff);o.txt=tx(`${o.hours} hours of time off. ${f1(l-o.hours)} hours left this month once approved.`,`${o.hours} jam keluar sebentar. Baki ${f1(l-o.hours)} jam bulan ini selepas diluluskan.`);o.warn=o.hours>l}
 else{const to=$('#lf-to').value;o.days=CAL.has(t)?(to>=from?dayDiff(from,to)+1:0):workDays(from,to);if(!o.days)return{...o,ok:false,txt:tx('The last day must be on or after the first day, and the dates can’t all be Sundays or public holidays.','Hari terakhir mesti sama atau selepas hari pertama, dan tarikh tidak boleh semuanya hari Ahad atau cuti umum.')};
  const nm=LT[t].replace(' (MC)','').replace(/^\w/,c=>c.toLowerCase()),nb=LT_BM[t].replace(' (MC)','').toLowerCase(),dE=o.days>1?'days':'day';
  if(t==='unpaid')o.txt=tx(`${o.days} unpaid ${dE}. This doesn’t touch your annual leave.`,`${o.days} hari cuti tanpa gaji. Cuti tahunan anda tidak terjejas.`);
  else if(!b[t].cap){o.txt=tx(`${o.days} ${dE} of ${nm}. You have no ${nm} set up yet, so HR will confirm it.`,`${o.days} hari ${nb}. ${LT_BM[t]} anda belum ditetapkan, jadi HR akan mengesahkannya.`);o.warn=true;return o}
  else{const l=left(b[t]);o.txt=tx(`${o.days} ${CAL.has(t)?'calendar ':''}${dE} of ${nm}. ${f1(l-o.days)} days left once approved.`,`${o.days} hari ${CAL.has(t)?'kalendar ':''}${nb}. Baki ${f1(l-o.days)} hari selepas diluluskan.`);o.warn=o.days>l}
  if(t==='paternity'&&dayDiff(today(),from)<30&&from>=today())o.txt+=tx(' Paternity leave should be applied for at least 30 days before the expected birth.',' Cuti paterniti patut dipohon sekurang-kurangnya 30 hari sebelum jangkaan kelahiran.')}
 if(o.warn)o.txt+=tx(' This is more than you have left. HR may ask you to take part of it as unpaid leave.',' Ini melebihi baki anda. HR mungkin meminta sebahagiannya diambil sebagai cuti tanpa gaji.');return o}

function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((r,j)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=r;s.onerror=j;document.head.appendChild(s)})}
async function exportXlsx(btn){const m=S.rm,y=m.slice(0,4);btn.disabled=true;btn.textContent='Preparing…';
 try{await loadXLSX();const X=window.XLSX,wb=X.utils.book_new();const add=(n,rows)=>{const ws=X.utils.aoa_to_sheet(rows);ws['!cols']=rows[0].map(()=>({wch:16}));X.utils.book_append_sheet(wb,ws,n)};
  const sl=S.sales.filter(s=>s.date.slice(0,7)===m).sort((a,b)=>a.date>b.date?1:-1);
  add('Sales '+m,[['Date','Entity','Cash (RM)','Card (RM)','E-wallet (RM)','Panel (RM)','Total (RM)','Transactions','Status','Submitted by','Decided by','Notes'],...sl.map(s=>[s.date,s.entity,s.split?.cash||0,s.split?.card||0,s.split?.ewallet||0,s.split?.panel||0,num(s.total),s.n||0,s.status,name(s.sid),s.by?name(s.by):'',s.notes||''])]);
  add('Sales by entity',[['Entity','Approved total (RM)','Pending total (RM)'],...ENT.map(e=>[e,sl.filter(s=>s.entity===e&&s.status==='approved').reduce((a,s)=>a+num(s.total),0),sl.filter(s=>s.entity===e&&s.status==='pending').reduce((a,s)=>a+num(s.total),0)])]);
  const lv=S.leaves.filter(l=>l.from.slice(0,4)===y).sort((a,b)=>a.from>b.from?1:-1);
  add('Leave '+y,[['Staff','ID','Entity','Type','From','To','Days','Hours','Status','Reason','Decided by','Slip attached'],...lv.map(l=>[name(l.sid),l.sid,S.staff[l.sid]?.entity||'',LT[l.type],l.from,l.to||l.from,l.days,l.hours||0,l.status,l.reason||'',l.by?name(l.by):'',l.doc?'Yes':''])]);
  const bk=Object.keys(DEF);add('Leave balances',[['Staff','ID','Entity','Date joined','Legal minimum check','Annual carried in','Carried days use by','Annual pro-rated (months)',...bk.flatMap(k=>[LT[k]+' allowance',LT[k]+' used']),'Unpaid days'],...Object.values(S.staff).map(s=>{const b=bal(s.id);return[s.name,s.id,s.entity,s.joined||'',s.joined?(below(s).join('; ')||'OK'):'No join date',b.annual.carry||0,b.annual.carry?b.annual.cfExp:'',b.annual.pro||'',...bk.flatMap(k=>[b[k].cap,b[k].used]),b.unpaid.used]})]);
  const tk=S.tasks.filter(t=>t.date.slice(0,7)===m).sort((a,b)=>a.date>b.date?1:-1);
  add('Wholesale '+m,[['Date','Staff','What was done','Clinics quoted','Pending quotations','Other pending','Status'],...tk.map(t=>[t.date,name(t.sid),t.done,(t.quotes||[]).map(q=>q.clinic+(q.amt?' (RM '+q.amt+')':'')).join('; '),(t.quotes||[]).filter(q=>q.status==='pending').map(q=>q.clinic).join('; '),t.hasPending?t.pending||'Yes':'',t.status])]);
  const buf=X.write(wb,{bookType:'xlsx',type:'array'});await DL.save({filename:'Nadia-Group-report-'+m+'.xlsx',data:buf});toast('Report downloaded')}
 catch(e){if(e&&e.code==='declined'){}else if(e&&e.code==='rate_limited')toast('A download is already open. Try again in a moment.');else toast('Couldn’t create the Excel file.')}
 btn.disabled=false;btn.textContent='Download Excel report'}
async function aiBrief(){if(!SAMPLE||S.aiBusy)return;S.aiBusy=true;S.ai='Writing…';renderData();const td=today(),tm=iso(new Date(Date.now()+864e5));
 const data={date:td,
  sales_submitted_today:S.sales.filter(s=>s.date===td).map(s=>({entity:s.entity,total_rm:num(s.total),status:s.status,transactions:s.n||0})),
  sales_waiting_for_approval:S.sales.filter(s=>s.status==='pending').map(s=>({entity:s.entity,date:s.date,total_rm:num(s.total)})),
  leave_waiting_for_approval:S.leaves.filter(l=>l.status==='pending').map(l=>({staff:name(l.sid),entity:S.staff[l.sid]?.entity,type:LT[l.type],dates:when(l),slip_attached:!!l.doc})),
  on_leave_today:S.leaves.filter(l=>l.status==='approved'&&cover(l,td)).map(l=>({staff:name(l.sid),entity:S.staff[l.sid]?.entity,type:LT[l.type]})),
  on_leave_tomorrow:S.leaves.filter(l=>l.status==='approved'&&cover(l,tm)).map(l=>({staff:name(l.sid),type:LT[l.type]})),
  wholesale_updates_today:S.tasks.filter(t=>t.date===td).map(t=>({staff:name(t.sid),done:t.done,quotations:(t.quotes||[]).map(q=>({clinic:q.clinic,rm:q.amt,status:q.status})),other_pending:t.hasPending?t.pending:''})),
  quotations_still_pending:pendQ().map(q=>({clinic:q.clinic,rm:q.amt,since:q.t.date,by:name(q.t.sid)}))};
 const prompt=`You are the operations assistant for Nadia Group in Kuala Lumpur (Pharmacy, Dental and Clinic, plus a Pharmacy Wholesale team). Write today's briefing for the ${ROLES[S.me.role]} in plain ${S.lang==='bm'?'Bahasa Malaysia':'English'}: 4 to 7 short lines, each starting with "• ", amounts as "RM 1,234.00". No headings and no markdown. Cover sales, what is waiting for approval, who is off today and tomorrow, what Wholesale did and quotations still pending. Point out anything unusual, such as an entity with no sales submitted today or a quotation waiting 3 or more days. If a section has nothing, skip it. Use only this data:\n`+JSON.stringify(data);
 try{const r=await SAMPLE(prompt,{modelTier:'quick',onText:({text})=>{S.ai=text;const e=$('#ai');if(e)e.textContent=text}});S.ai=r.text}
 catch(e){S.ai=e&&e.code==='rate_limited'?'Too many requests just now. Try again in a minute.':'The briefing couldn’t be written right now.'}
 S.aiBusy=false;renderData()}

 if(a==='go'){S.tab=v;S.edit=null;S.del=null;S.polEdit=false;render();scrollTo(0,0);return}

 if(a==='resetcode'){if(S.del!=='code'+id){S.del='code'+id;renderData();return}S.del=null;b.disabled=true;try{const c=await AUTH.resetPasscode(id);S.newCode={id,code:c};renderData();scrollTo(0,0)}catch(e){toast('Couldn’t reset the passcode. Try again.');b.disabled=false}return}

 if(a==='lt'){S.lt=v;$('#form').innerHTML=leaveForm();showCalc();return}
 if(a==='addq'){$('#qrows').insertAdjacentHTML('beforeend',qrow());return}
 if(a==='rmq'){const r=b.closest('.qrow');if($('#qrows').children.length>1)r.remove();else r.querySelectorAll('input').forEach(i=>i.value='');return}
 if(a==='sent'){S.sent=v;renderData();return}
 if(a==='pickent'){$('#sf-ent').value=v;document.querySelectorAll('.entpick button').forEach(x=>{const on=x.dataset.v===v;x.classList.toggle('on',on);x.setAttribute('aria-checked',on)});return}
 if(a==='calm'){S.cal=v==='0'?today().slice(0,7):shiftM(S.cal,+v);renderData();return}
 if(a==='rmm'){S.rm=shiftM(S.rm,+v);renderData();return}

 if(a==='poledit'){S.polEdit=!S.polEdit;render();return}
 if(a==='ack'){await w(()=>db.doc('staff/'+S.me.id).update({ack:pol().ver,ackAt:Date.now()}),'Thank you. Policy accepted.');return}
 if(a==='edit'){S.edit=id||null;$('#form').innerHTML=staffForm();if(id){$('#st-name').focus();scrollTo(0,0)}return}
 if(a==='cancel'){await w(()=>db.doc('leaves/'+id).delete(),'Request cancelled');return}
 if(a==='review'){await w(()=>db.doc('tasks/'+id).update({status:'reviewed',by:S.me.id,at:Date.now()}),'Marked as reviewed');return}
 if(a==='qsent'){const t=S.tasks.find(x=>x.id===id);if(!t)return;const i=+b.dataset.i;b.disabled=true;const q=(t.quotes||[]).map((x,k)=>k===i?{...x,status:'sent',sentAt:today()}:{...x});
  const still=q.some(x=>x.status==='pending')||!!t.pending;await w(()=>db.doc('tasks/'+id).update({quotes:q,hasPending:still}),'Marked as sent');return}
 if(a==='dec'){const c=b.dataset.col,note=($('#c-'+id)?.value||'').trim();b.disabled=true;
  await w(()=>db.doc(c+'/'+id).update({status:v,by:S.me.id,byName:S.me.name,note,at:Date.now()}),v==='approved'?'Approved':'Rejected');return}
 if(a==='resetpin'){if(S.del!=='pin'+id){S.del='pin'+id;renderData();return}S.del=null;await w(()=>db.doc('staff/'+id).update({pinHash:''}),'PIN reset. They’ll create a new one at next sign-in.');return}
 if(a==='rmhol'){if(S.del!=='h'+v){S.del='h'+v;renderData();return}S.del=null;const list=hols().filter(h=>h.date!==v);await w(()=>db.doc('settings/holidays').set({list}),'Holiday removed');return}
 if(a==='del'||a==='rmstaff'){if(S.del!==id){S.del=id;renderData();return}S.del=null;await w(()=>db.doc((a==='del'?b.dataset.col:'staff')+'/'+id).delete(),'Deleted');return}

[/^Some (\d+) leave is still waiting for approval\. Decide it first so the unused days are right\.$/,'Sebahagian cuti $1 masih menunggu kelulusan. Putuskan dahulu supaya baki hari tepat.'],
[/^(\w{3}) only$/,'$1 sahaja'],
[/^(\d+) of (\d+) carried to (\d+)$/,'$1 daripada $2 dibawa ke $3'],[/^Carried forward for (\d+) staff$/,'Dibawa ke hadapan untuk $1 kakitangan'],[/^Stopped after (\d+) staff\. Try again\.$/,'Berhenti selepas $1 kakitangan. Cuba lagi.'],
[/^Hi (.+)\. HR and Director accounts are protected with a PIN\.$/,'Hai $1. Akaun HR dan Pengarah dilindungi dengan PIN.'],
[/^Hi (.+)\. Choose a PIN only you know\. You’ll use it with your ID every time\.$/,'Hai $1. Pilih PIN yang hanya anda tahu. Anda akan menggunakannya bersama ID setiap kali.'],
[/^ID (\d+) already belongs to (.+)\.$/,'ID $1 sudah digunakan oleh $2.'],
[/^(Pharmacy|Dental|Clinic) sales for (.+) are already submitted\.$/,(m,e,d)=>`Jualan ${ENTN[e]} bagi ${d} sudah dihantar.`],
[/^Your own (\d+) pending requests? must be approved by the Director\.$/,'$1 permohonan anda sendiri yang menunggu mesti diluluskan oleh Pengarah.'],[/^Your own (\d+) pending requests? must be approved by the HR Manager\.$/,'$1 permohonan anda sendiri yang menunggu mesti diluluskan oleh Pengurus HR.'],
[/^Last updated (.+)\.$/,'Kali terakhir dikemas kini $1.'],
[/^([▲▼]) (\d+)% vs (\S+)$/,'$1 $2% berbanding $3'],
[/^Cash (RM.*)$/,'Tunai $1'],[/^Card (RM.*)$/,'Kad $1'],[/^E-wallet (RM.*)$/,'E-dompet $1'],[/^Panel (RM.*)$/,'Panel $1'],
[/^Pharmacy Wholesale · Staff · ID (\d+) · Leave year (\d+)$/,'Farmasi Borong · Kakitangan · ID $1 · Tahun cuti $2']
];

function trK(k){if(BM[k]!=null)return BM[k];
 const e=k.match(/^(.*?)([.:,?!…]+)$/);if(e&&BM[e[1]]!=null)return BM[e[1]]+e[2];
 if(k.includes(' · ')){const ps=k.split(' · '),out=ps.map(p=>trK(p)??p);if(out.some((x,i)=>x!==ps[i]))return out.join(' · ')}
 for(const[r,f]of BMRX){const m=k.match(r);if(m)return typeof f==='function'?f(...m):k.replace(r,f)}
 return null}
function trS(t){if(S.lang!=='bm'||!t)return t;const k=t.trim();if(!k)return t;const v=trK(k);return v==null?t:t.replace(k,v)}
function trNode(n){if(n.nodeType===3){if(!n.parentElement||!n.parentElement.closest('textarea,script,style,.pol')){const v=trS(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v}return}if(n.nodeType!==1||n.closest('.pol')&&!n.closest('.acts'))return;
 const tw=document.createTreeWalker(n,NodeFilter.SHOW_TEXT,{acceptNode:x=>x.parentElement&&x.parentElement.closest('textarea,script,style,.pol')&&!x.parentElement.closest('.acts')?2:1});let x;while(x=tw.nextNode()){const v=trS(x.nodeValue);if(v!==x.nodeValue)x.nodeValue=v}
 [n,...n.querySelectorAll('[placeholder],[aria-label],[title]')].forEach(e=>['placeholder','aria-label','title'].forEach(a=>{if(e.hasAttribute(a)){const o=e.getAttribute(a),v=trS(o);if(v!==o)e.setAttribute(a,v)}}))}
const MO=new MutationObserver(ms=>{if(S.lang!=='bm')return;MO.disconnect();ms.forEach(m=>m.addedNodes.forEach(trNode));MO.observe(document.body,{childList:true,subtree:true})});
MO.observe(document.body,{childList:true,subtree:true});
if(S.lang==='bm')trNode(document.getElementById('app'));

/* ---------- data ---------- */
const AUTH=window.NADIA_AUTH;let unsubs=[];
function startData(){if(S.started)return;S.started=true;S.ready=false;
 const tm=setTimeout(()=>{if(!S.ready){S.note='Can’t reach the portal data yet. It will load by itself once the connection is back.';render()}},10000);
 const err=e=>{S.note='Some data couldn’t load. Close and reopen the page to try again.';render()};
 const sub=(col,fn)=>unsubs.push(db.collection(col).onSnapshot(q=>{fn(q.docs.map(d=>({...d.data(),id:d.id})));renderData()},err));
 unsubs.push(db.collection('staff').onSnapshot(q=>{S.staff={};q.docs.forEach(d=>S.staff[d.id]={...d.data(),id:d.id});
  S.ready=true;S.note='';clearTimeout(tm);
  if(S.me){S.me=S.staff[S.me.id]||S.me;renderData();return}maybeEnter()},err));
 sub('leaves',a=>{liveNotice(a);S.leaves=a});sub('tasks',a=>S.tasks=a);sub('sales',a=>{liveSales(a);S.sales=a});
 sub('settings',a=>{S.set={};a.forEach(d=>S.set[d.id]=d)})}
function stopData(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];S.started=false;S.staff={};S.leaves=[];S.tasks=[];S.sales=[];S.set={};S.me=null;S.myId=null;S.seenL=null;S.seenS=null}
/* live notices: HR and the Director see new requests the moment they arrive; staff see decisions */
function liveNotice(a){if(!S.me){S.seenL=null;return}const prev=S.seenL;S.seenL=new Map(a.map(l=>[l.id,l.status]));if(!prev)return;
 a.forEach(l=>{const was=prev.get(l.id);if(was===undefined&&l.status==='pending'&&l.sid!==S.me.id&&isBoss())toast(tx(`New leave request: ${name(l.sid)}, ${LT[l.type]}`,`Permohonan cuti baharu: ${name(l.sid)}, ${LT_BM[l.type]}`));
  else if(was==='pending'&&l.status!=='pending'&&l.sid===S.me.id)toast(tx(`Your ${LT[l.type].replace(/^\w/,c=>c.toLowerCase())} was ${l.status}`,`${LT_BM[l.type]} anda telah ${l.status==='approved'?'diluluskan':'ditolak'}`))})}
function liveSales(a){if(!S.me){S.seenS=null;return}const prev=S.seenS;S.seenS=new Set(a.map(x=>x.id));if(!prev||!isDir())return;a.forEach(x=>{if(!prev.has(x.id)&&x.status==='pending')toast(tx(`New daily sales: ${x.entity}, ${rm(x.total)}`,`Jualan harian baharu: ${x.entity}, ${rm(x.total)}`))})}
(async()=>{db=await C.use('db');ASSETS=await C.use('assets');DL=await C.use('downloads');SAMPLE=null;
 if(!db){S.noDb=true;render();return}
 S.stage='code';S.ready=true;render();
 try{const m=await AUTH.restore();if(m&&m.sid){S.busy=true;render();afterAuth(m)}}catch(e){}
})();
}
